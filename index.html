<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie de Produits</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <!-- Switch thème -->
    <div class="theme-switch">
        <input type="checkbox" id="toggle-theme">
        <label for="toggle-theme"></label>
    </div>

    <!-- Galerie -->
    <div class="gallery">
        <div class="card">
            <img src="/images/p1.jpg" alt="Produit 1">
            <h3>Ordinateurs</h3>
            <p>Description du produit 1.</p>
        </div>
        <div class="card">
            <img src="/images/p2.jpg" alt="Produit 2">
            <h3>Accessoire </h3>
            <p>Description du produit 2.</p>
        </div>
        <div class="card">
            <img src="/images/p3.jpg" alt="Produit 3">
            <h3>Hadware</h3>
            <p>Description du produit 3.</p>
        </div>
        <div class="card">
            <img src="/images/p4.jpg" alt="Produit 4">
            <h3>Logiciel</h3>
            <p>Description du produit 4.</p>
        </div>
    </div>

    <script src="/js/script.js"></script>
</body>

</html>
